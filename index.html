<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grégoire Besson</title>
  <meta name="description" content="">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e2001a">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/logo/apple-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Preload the hero photo when the visitor lands on the home page
    if (!location.hash || location.hash === '#/' || location.hash === '#') {
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high';
      l.href = 'assets/img/field/hero-home-1280.jpg';
      l.setAttribute('imagesrcset', 'assets/img/field/hero-home-800.jpg 800w, assets/img/field/hero-home-1280.jpg 1280w, assets/img/field/hero-home-1920.jpg 1920w');
      l.setAttribute('imagesizes', '100vw');
      document.head.appendChild(l);
    }
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <!-- Concept disclaimer: this is a redesign proposal, not the official site -->
  <div class="concept" role="note">
    <strong data-i18n="concept.label"></strong>
    <span data-i18n="concept.text"></span>
    <a href="https://www.gregoire-besson.com" data-i18n="concept.link"></a>
  </div>

  <header class="header" id="header">
    <div class="header__bar">
      <a class="header__logo" href="#/" aria-label="Grégoire Besson">
        <img class="logo-white" src="assets/img/logo/logo-h.svg" alt="Grégoire Besson" width="176" height="26">
        <img class="logo-red" src="assets/img/logo/logo-h-red.svg" alt="" width="176" height="26">
      </a>

      <nav class="nav" aria-label="Main">
        <button class="nav__link" id="megaBtn" aria-expanded="false" aria-controls="mega">
          <span data-i18n="nav.machines"></span>
          <svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a class="nav__link" href="#/aterforsaljare" data-route="dealers" data-i18n="nav.dealers"></a>
        <a class="nav__link" href="#/service" data-route="service" data-i18n="nav.services"></a>
        <a class="nav__link" href="#/kontakt" data-route="contact" data-i18n="nav.contact"></a>
      </nav>

      <div class="header__end">
        <div class="lang">
          <button class="lang__btn" id="langBtn" aria-expanded="false" aria-controls="langMenu">
            <img class="flag" id="langFlag" src="assets/img/flags/en.svg" alt="" width="20" height="20">
            <span id="langCode">EN</span>
            <svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="pop pop--lang" id="langMenu" hidden>
            <p class="pop__label" data-i18n="nav.language"></p>
            <div id="langList"></div>
          </div>
        </div>
        <a class="btn btn--red btn--sm header__cta" href="#/kontakt?typ=2" data-i18n="nav.quote"></a>
        <button class="burger" id="burger" aria-expanded="false" aria-controls="sheet"><span></span><span></span><span class="sr" data-i18n="nav.menu"></span></button>
      </div>
    </div>

    <!-- Mega menu -->
    <div class="mega" id="mega" hidden>
      <div class="mega__inner">
        <div class="mega__cols" id="megaCols"></div>
        <aside class="mega__promo">
          <img src="assets/img/field/hero-home-800.jpg" alt="" loading="lazy">
          <div>
            <p class="mega__promo-title" data-i18n="nav.megaCta"></p>
            <p data-i18n="nav.megaCtaText"></p>
            <a class="btn btn--white btn--sm" href="#/maskiner" data-i18n="nav.megaCtaBtn"></a>
          </div>
        </aside>
      </div>
    </div>
  </header>

  <!-- Mobile sheet -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__body" id="sheetBody"></div>
  </div>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__top">
        <div class="footer__brand">
          <img src="assets/img/logo/logo-h.svg" alt="Grégoire Besson" width="190" height="28">
          <p data-i18n="footer.tagline"></p>
          <ul class="social">
            <li><a href="https://www.facebook.com/GregoireBessonSAS/" aria-label="Facebook"><img src="assets/img/ui/facebook.svg" alt=""></a></li>
            <li><a href="https://www.instagram.com/gregoire.besson/" aria-label="Instagram"><img src="assets/img/ui/instagram.svg" alt=""></a></li>
            <li><a href="https://www.youtube.com/c/GregoireBessonSASofficial/" aria-label="YouTube"><img src="assets/img/ui/youtube.svg" alt=""></a></li>
            <li><a href="https://www.linkedin.com/company/the-real-gb-group/" aria-label="LinkedIn"><img src="assets/img/ui/linkedin.svg" alt=""></a></li>
            <li><a href="https://twitter.com/gbessonsas/" aria-label="X"><img src="assets/img/ui/twitter.svg" alt=""></a></li>
          </ul>
        </div>
        <div class="footer__cols" id="footerCols"></div>
      </div>
      <div class="footer__bottom">
        <span>© <span id="year"></span> Grégoire Besson · <a href="https://gb-group.co">GB Group</a> · <span data-i18n="footer.rights"></span></span>
        <ul class="footer__legal" id="legal"></ul>
      </div>
    </div>
  <!-- elevate-credit -->
<style>.elevate-credit{max-width:1240px;margin:24px auto 0;padding:20px 16px 0;border-top:1px solid rgba(128,128,128,.25);display:flex;justify-content:center;box-sizing:border-box}.elevate-credit a{display:inline-flex;align-items:center;gap:8px;padding:8px 0;font:inherit;font-size:13px;line-height:1;color:inherit;opacity:.55;text-decoration:none;transition:opacity .2s}.elevate-credit a:hover,.elevate-credit a:focus-visible{opacity:1}.elevate-credit svg{width:16px;height:16px;flex:none;display:block}@media(min-width:1024px){.elevate-credit a{font-size:14px}}</style>
<div class="elevate-credit"><a href="https://elevatestudio.nu" target="_blank" rel="noopener"><svg viewBox="0 0 1884.3 1353.9" aria-hidden="true"><path d="M0.0 1353.9 L1218.7 0.0 L1218.7 329.1 L479.7 1136.4 L786.7 1132.4 L1215.5 687.4 L1884.3 1349.9 L1590.1 1349.9 L1218.6 994.7 L865.4 1349.9Z" fill="currentColor"/></svg>Byggd av Elevate Studio</a></div>
</footer>

  <script src="assets/js/models.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/data/content.js"></script>
  <script src="assets/data/dealers.js"></script>
  <script src="assets/data/media.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
